version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "Account-Switcher"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  dist:
    summary: Builds and stages just the shippable files in dist/, with a zip beside them
    cmds:
      - task: "{{OS}}:dist"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  test:
    summary: Runs all Go and frontend tests
    cmds:
      - go test -race -count=1 ./internal/... ./cmd/...
      - cd frontend && pnpm run test && cd ..

  version:
    summary: Prints the application version from build/config.yml
    cmds:
      - cmd: python tools/bump_version.py --print
        platforms: [windows]
      - cmd: python3 tools/bump_version.py --print
        platforms: [linux, darwin]

  version:bump:
    # Only the bare part word survives the wrapper; `wails3 task` eats any flag
    # after `--`, so use the script directly for --dry-run.
    summary: 'Bumps the version in build/config.yml and the Windows resources. Usage: wails3 task version:bump -- minor'
    cmds:
      - cmd: python tools/bump_version.py {{.PART}}
        platforms: [windows]
      - cmd: python3 tools/bump_version.py {{.PART}}
        platforms: [linux, darwin]
    vars:
      PART: '{{.CLI_ARGS | default "patch"}}'

  version:check:
    summary: Fails when a copy of the version has drifted from build/config.yml
    cmds:
      - cmd: python tools/bump_version.py --check
        platforms: [windows]
      - cmd: python3 tools/bump_version.py --check
        platforms: [linux, darwin]
